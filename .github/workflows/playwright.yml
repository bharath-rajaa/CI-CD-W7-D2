name: Playwright

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git diff in regression selection

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests (changed-only regression on PRs, full suite on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:changed -- origin/${{ github.base_ref }}
          else
            npm test
          fi

      - name: Build test summary
        if: always()
        run: npm run summary

      - name: Upload HTML report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
